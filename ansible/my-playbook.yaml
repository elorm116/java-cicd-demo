---
- name: Deploy Docker Container on EC2 Server
  hosts: aws_ec2
  become: yes
  gather_facts: yes

  vars_files:
    - ec2-vars.yaml

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

  tasks:
    - name: Make sure all packages are up to date
      yum:
        name: '*'
        state: latest
        update_cache: yes
      tags: ['packages']
    
    - name: Ensure Docker and Python3 are installed
      yum:
        name: 
          - python3
          - python3-pip
          - docker
        state: present
      tags: ['packages']
    
    # - name: Install Python Docker SDK (required by Ansible)
    #   pip:
    #     name: 
    #       - docker
    #     executable: pip3
    #   tags: ['packages']

    - name: Install Docker Compose v2 plugin
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: '0755'
      tags: ['packages']

    - name: Verify docker-compose installation
      command: docker compose version
      register: docker_compose_check
      changed_when: false

    - name: Display docker-compose version
      debug:
        msg: "{{ docker_compose_check.stdout }}"

    - name: Make sure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes
      tags: ['docker']

    - name: Ensure ec2-user is in the docker group
      user:
        name: ec2-user
        groups: docker
        append: yes
      notify: restart docker
      tags: ['docker']

    - name: Make sure to reconnect as ec2-user
      meta: reset_connection

    - name: Test docker pull hello-world image
      docker_image:
        name: hello-world
        source: pull
      tags: ['test']

    - name: Create directory for docker-compose file
      file:
        path: "{{ docker_compose_dest | dirname }}"
        state: directory
        mode: '0755'
        owner: ec2-user
        group: ec2-user
      tags: ['deploy']

    - name: Ensure that docker-compose file is present
      copy:
        src: "{{ docker_compose_src }}"
        dest: "{{ docker_compose_dest }}"
        mode: '0644'
        owner: ec2-user
        group: ec2-user
        validate: docker compose -f %s config
      tags: ['deploy']

    - name: Make sure to login to docker hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "{{ docker_hub_username }}"
        password: "{{ docker_hub_password }}"
        reauthorize: yes
      when: docker_hub_username is defined and docker_hub_password is defined
      tags: ['deploy']
    
    - name: Stop existing containers (if any)
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_dest | dirname }}"
        state: absent
      ignore_errors: yes
      tags: ['deploy']

    - name: Deploy the Docker containers using docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_dest | dirname }}"
        pull: always
        state: present
      register: docker_deploy
      tags: ['deploy']

    - name: Display deployment result
      debug:
        var: docker_deploy
      tags: ['deploy']

    - name: Wait for containers to be healthy
      pause:
        seconds: 10
      when: docker_deploy.changed
      tags: ['deploy']

    - name: Verify containers are running
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ container_names }}"
      register: container_status
      when: container_names is defined
      tags: ['verify']

    - name: Display container status
      debug:
        msg: "Container {{ item.item }} is {{ item.container.State.Status }}"
      loop: "{{ container_status.results }}"
      when: 
        - container_names is defined
        - item.container is defined
      tags: ['verify']